# ReadTheDocs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The docs are the only thing built from Python in this repository; the Rust
# crate is untouched by this file.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

mkdocs:
  configuration: docs/manual/mkdocs.yml
  # No CI job builds the docs, so this is the only thing standing between a
  # broken link and a published page. Any MkDocs warning fails the build.
  fail_on_warning: true

python:
  install:
    - requirements: docs/manual/requirements.txt
