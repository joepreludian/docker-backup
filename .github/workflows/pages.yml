name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A queued run supersedes another waiting run, but never
# cancels a deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Pages must already be enabled on the repo. The workflow's GITHUB_TOKEN
      # cannot create the site -- configure-pages fails with "Resource not
      # accessible by integration" -- so `enablement: true` is not an option
      # here. Enable it once, out of band:
      #     gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      - uses: actions/configure-pages@v6

      # install.sh lives at the repo root, where it is obvious to anyone
      # browsing the project and easy for CI to lint. Copying it in at deploy
      # time means the served script and the one in git are never two files
      # that can drift apart.
      #
      # docs/site/CNAME is copied along with everything else, but Pages ignores
      # it for Actions-built sites: the custom domain lives in the repo's Pages
      # settings instead, set once with
      #     gh api -X PUT repos/OWNER/REPO/pages -f cname=...
      - name: Stage the site
        run: |
          mkdir -p _site
          cp -R docs/site/. _site/
          cp install.sh _site/install.sh
          ls -l _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
