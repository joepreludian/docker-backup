name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  macos-test:
    name: Test (macOS)
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # No docker daemon here on purpose: `doctor` must still report when the
      # daemon is unreachable, and the CLI tests assert exactly that.
      - name: Test
        run: cargo test

  docker-integration:
    name: Docker integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Show the daemon under test
        run: |
          docker version
          docker volume ls

      # These never run on a maintainer machine: they exercise the --overwrite
      # path, which is only safe on a disposable daemon that owns no real data.
      - name: Run ignored integration tests
        env:
          DOCKER_BACKUP_IT: "1"
        run: cargo test --test docker_integration -- --ignored --test-threads=1

  install-script:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships on the Ubuntu runners but not the macOS ones.
      - name: Lint
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh --severity=style install.sh

      # This is the command strangers are told to pipe into their shell, so it
      # runs for real against the published release rather than being trusted.
      - name: Install into a throwaway directory
        env:
          DOCKER_BACKUP_BIN_DIR: ${{ runner.temp }}/install-test
        run: |
          sh install.sh
          "$DOCKER_BACKUP_BIN_DIR/docker-backup" --version
