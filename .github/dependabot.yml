version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Documentation toolchain only; nothing here affects the crate.
  - package-ecosystem: pip
    directory: "/docs/manual"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
